name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go test -race ./...
      - run: node scripts/package.mjs
      - name: Pack npm artifacts
        run: |
          mkdir -p dist/tarballs
          for package in dist/npm/*; do npm pack "./$package" --pack-destination dist/tarballs; done
          npm pack --pack-destination dist/tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: charstle-release
          path: |
            dist/charstle-*
            dist/SHA256SUMS-*
            dist/tarballs/*.tgz
            dist/npm/
